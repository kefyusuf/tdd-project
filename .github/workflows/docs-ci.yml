name: Docs CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Prettier format check
        run: npx --yes prettier --check "**/*.md" "**/*.json" "**/*.yml"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-build:
    name: Site build check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files.*.filename, 'package') ||
      contains(github.event.pull_request.changed_files.*.filename, 'docs/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (dead-link and config verification)
        run: npm run docs:build
